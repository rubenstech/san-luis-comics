<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Historietas - San Luis Avanza</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #1a365d;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-content h3 {
            font-size: 15px;
            color: #2c5282;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galería de Historietas y Proyectos</h1>
        <p>Visión Perú Cumple - San Luis Avanza</p>
    </header>

    <div class="container" id="galeria-container">
        <!-- Las tarjetas se cargarán automáticamente aquí mediante JavaScript -->
    </div>

    <script>
        const totalComics = 77;
        const container = document.getElementById('galeria-container');

        for (let i = 1; i <= totalComics; i++) {
            const card = document.createElement('div');
            card.className = 'card';

            // Del 1 al 9 busca .png, a partir del 10 busca .jpeg
            let extension = (i < 10) ? 'png' : 'jpeg';

            card.innerHTML = `
                <img src="images/comic-${i}.${extension}" alt="Historieta ${i}" loading="lazy">
                <div class="card-content">
                    <h3>Historieta / Proyecto N° ${i}</h3>
                </div>
            `;

            container.appendChild(card);
        }
    </script>

</body>
</html>
